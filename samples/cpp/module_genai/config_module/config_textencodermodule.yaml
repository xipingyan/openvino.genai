global_context:
  default_device: "GPU"
  enable_shared_memory: True
  device_id: "GPU.0"

# ----------------------------------------------------------------------
# MODULES DEFINITION
# ----------------------------------------------------------------------
pipeline_modules:

  # --- 1. Parameter 模块 ---
  prompts:
    type: "ParameterModule"
    outputs:
      - name: "prompts_data"
        type: "VecString"

  # --- 2. Prompt Encode 模块 ---
  prompt_encoder:
    type: "TextEncoderModule"
    device: "GPU"
    inputs:
      - name: "prompts_input"
        type: "VecString"
        source: "prompts.prompts_data"
    outputs:
      - name: "input_ids"
        type: "OVTensor"
      - name: "mask"
        type: "OVTensor"
    params:
      model_path: "../config_pipeline/Qwen2.5-VL-3B-Instruct/"